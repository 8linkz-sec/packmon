# GitLab CI -- jobs live in 8linkz-sec/ci-templates.
# Go module at the root; web assets (Tailwind, htmx copy, ESLint, Stylelint, Redocly) via package.json.
# Not related to ci/gitlab/.packmon-scan.yml, the unoperated consumer template.
include:
  - project: 8linkz-sec/ci-templates
    ref: main
    file:
      - templates/base.yml
      - templates/go.yml
      - templates/node.yml
      - templates/gitleaks.yml
      - templates/sonarqube.yml
      - templates/sbom-dtrack.yml
      # Builds the server and cli images, scans them with Trivy, uploads one SBOM per image to Dependency-Track.
      - templates/container.yml
      # Publishes main to GitHub after a green pipeline, once the GITHUB_DEPLOY_KEY file variable is set.
      - templates/github-push.yml

variables:
  # The two Dockerfile targets that ship (name:context:dockerfile:target); compose builds both from the root.
  CONTAINER_IMAGES: "server:.:Dockerfile:server cli:.:Dockerfile:cli"
  # package.json only has these scripts; build:web regenerates the committed tailwind.css and htmx.min.js.
  NODE_SCRIPTS: "lint:web lint:openapi build:web"
  # As in templates/go.yml, plus the generated/vendored web assets.
  SONAR_EXTRA_ARGS: >-
    -Dsonar.sources=.
    -Dsonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**,**/node_modules/**,.go/**,.cache/**,internal/web/static/htmx.min.js,internal/web/static/tailwind.css
    -Dsonar.tests=.
    -Dsonar.test.inclusions=**/*_test.go
    -Dsonar.go.coverage.reportPaths=coverage.out

# The test suites require these tools and fail (by design) when one is missing:
#   Chromium            HTML report browser tests in cmd/packmon (PACKMON_BROWSER_BIN)
#   node, npm + npm ci  ESLint/Stylelint/.npmrc contracts in tests/ci (Stylelint runs from node_modules)
#   docker CLI+compose  `docker compose config` contracts in tests/ci (no daemon is used)
#   golangci-lint       configuration contract in tests/ci (same version as the Makefile pin)
# Debian packages are signature-checked by apt; Node is checked against the official SHA-256; golangci-lint
# is built from its module, checked by the Go checksum database. Every pipeline can write to the shared /cache,
# so nothing is executed from it: the cached Node archive is copied out and re-verified on every run, and both
# tools are unpacked or built into job-local directories. apt keeps no shared cache (concurrent jobs would
# contend for its lock).
.packmon-test-tools:
  variables:
    NODE_VERSION: "26.13.0"
    NODE_SHA256: 5848553868b402d3fabb5b09270649977780a390f832155721025a08b5104455
    GOLANGCI_LINT_VERSION: v2.14.0
    PACKMON_BROWSER_BIN: /usr/bin/chromium
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - mkdir -p /cache/tools
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium docker-cli docker-compose >/dev/null
    - |
      node_dir="$(mktemp -d)"
      node_tgz="$node_dir/node.tar.gz"
      cached_tgz="/cache/tools/node-v${NODE_VERSION}-linux-x64.tar.gz"
      cp "$cached_tgz" "$node_tgz" 2>/dev/null || true
      if ! echo "${NODE_SHA256}  $node_tgz" | sha256sum -c --status - 2>/dev/null; then
        curl -fsSLo "$node_tgz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
        echo "${NODE_SHA256}  $node_tgz" | sha256sum -c -
        cp "$node_tgz" "$cached_tgz.$$" && mv -f "$cached_tgz.$$" "$cached_tgz"
      fi
      tar -xzf "$node_tgz" -C "$node_dir" --strip-components=1
      export PATH="$node_dir/bin:$PATH"
    - |
      lint_dir="$(mktemp -d)"
      GOBIN="$lint_dir" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      export PATH="$lint_dir:$PATH"
    - node --version && npm --version && docker compose version && chromium --version && golangci-lint version
    - npm ci --no-audit --no-fund

# node_modules now exists in the checkout; like the Makefile's GO_PACKAGES, keep its Go package
# (node_modules/flatted/golang/pkg/flatted) out of the test run.
go-test:
  extends: [.go-base, .packmon-test-tools]
  script:
    - go test $(go list ./... | grep -v /node_modules/) -count=1 -timeout=10m -coverprofile=coverage.out

go-test-race:
  extends: [.go-base, .packmon-test-tools]
  script:
    - go test $(go list ./... | grep -v /node_modules/) -race -count=1 -timeout=10m

# Same linter version as the Makefile pin (GOLANGCI_LINT_VERSION), so local and CI runs agree.
golangci-lint:
  image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
