# GitLab CI -- jobs live in 8linkz-sec/ci-templates.
# Go module at the root; web assets (Tailwind, htmx copy, ESLint, Stylelint, Redocly) via package.json.
# Not related to ci/gitlab/.packmon-scan.yml, the unoperated consumer template.
include:
  - project: 8linkz-sec/ci-templates
    ref: main
    file:
      - templates/base.yml
      - templates/go.yml
      - templates/node.yml
      - templates/gitleaks.yml
      - templates/sonarqube.yml
      - templates/sbom-dtrack.yml
      # Builds the server and cli images, scans them with Trivy, uploads one SBOM per image to Dependency-Track.
      - templates/container.yml
      # Publishes main to GitHub after a green pipeline, once the GITHUB_DEPLOY_KEY file variable is set.
      - templates/github-push.yml

variables:
  # The two Dockerfile targets that ship (name:context:dockerfile:target); compose builds both from the root.
  CONTAINER_IMAGES: "server:.:Dockerfile:server cli:.:Dockerfile:cli"
  # package.json only has these scripts; build:web regenerates the committed tailwind.css and htmx.min.js.
  NODE_SCRIPTS: "lint:web lint:openapi build:web"
  # As in templates/go.yml, plus the generated/vendored web assets.
  SONAR_EXTRA_ARGS: >-
    -Dsonar.sources=.
    -Dsonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**,**/node_modules/**,.go/**,.cache/**,internal/web/static/htmx.min.js,internal/web/static/tailwind.css
    -Dsonar.tests=.
    -Dsonar.test.inclusions=**/*_test.go
    -Dsonar.go.coverage.reportPaths=coverage.out

# The test suites require these tools and fail (by design) when one is missing:
#   Chromium            HTML report browser tests in cmd/packmon (PACKMON_BROWSER_BIN)
#   node, npm + npm ci  ESLint/Stylelint/.npmrc contracts in tests/ci (Stylelint runs from node_modules)
#   docker CLI+compose  `docker compose config` contracts in tests/ci (no daemon is used)
#   golangci-lint       configuration contract in tests/ci (same version as the Makefile pin)
# Debian packages are signature-checked by apt; Node is checked against the official SHA-256; golangci-lint
# is built from its module, checked by the Go checksum database. Every pipeline can write to the shared /cache,
# so nothing is executed from it: the cached Node archive is copied out and re-verified on every run, and both
# tools are unpacked or built into job-local directories. apt keeps no shared cache (concurrent jobs would
# contend for its lock).
.packmon-test-tools:
  variables:
    NODE_VERSION: "26.13.1"
    NODE_SHA256: 518674de2b621728a5e4486f5fb3b7d2900bb3cc4aa97969edaa463db99f9778
    GOLANGCI_LINT_VERSION: v2.15.0
    PACKMON_BROWSER_BIN: /usr/bin/chromium
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - mkdir -p /cache/tools
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium docker-cli docker-compose >/dev/null
    - |
      node_dir="$(mktemp -d)"
      node_tgz="$node_dir/node.tar.gz"
      cached_tgz="/cache/tools/node-v${NODE_VERSION}-linux-x64.tar.gz"
      cp "$cached_tgz" "$node_tgz" 2>/dev/null || true
      if ! echo "${NODE_SHA256}  $node_tgz" | sha256sum -c --status - 2>/dev/null; then
        curl -fsSLo "$node_tgz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
        echo "${NODE_SHA256}  $node_tgz" | sha256sum -c -
        cp "$node_tgz" "$cached_tgz.$$" && mv -f "$cached_tgz.$$" "$cached_tgz"
      fi
      tar -xzf "$node_tgz" -C "$node_dir" --strip-components=1
      export PATH="$node_dir/bin:$PATH"
    - |
      lint_dir="$(mktemp -d)"
      GOBIN="$lint_dir" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      export PATH="$lint_dir:$PATH"
    - node --version && npm --version && docker compose version && chromium --version && golangci-lint version
    - npm ci --no-audit --no-fund

# node_modules now exists in the checkout; like the Makefile's GO_PACKAGES, keep its Go package
# (node_modules/flatted/golang/pkg/flatted) out of the test run.
go-test:
  extends: [.go-base, .packmon-test-tools]
  script:
    - go test $(go list ./... | grep -v /node_modules/) -count=1 -timeout=10m -coverprofile=coverage.out

go-test-race:
  extends: [.go-base, .packmon-test-tools]
  script:
    - go test $(go list ./... | grep -v /node_modules/) -race -count=1 -timeout=10m

# Same linter line as the Makefile pin (GOLANGCI_LINT_VERSION), so local and CI runs agree; the image
# follows its line tag (no digest) so every pipeline pulls the line's current patch release.
golangci-lint:
  image: golangci/golangci-lint:v2.15

# Tag-gated suites (the Makefile's test-e2e, test-integration and the tagged vet; DESIGN.md "CI/CD Integration").
# scripts/tagged-test-packages.sh lists every package with a test file built only under the tag (tests/ci pins it
# to the inventory the Makefile targets are checked against), so a new tagged test package runs here without a
# pipeline edit.

# Compile and vet check of every integration- and e2e-tagged file (the Makefile's TAGGED_LINT_DIRS). The tagged
# golangci-lint pass of `make lint` is not wired yet: it still reports existing findings (Todo.txt "golangci-lint
# with the `integration` build tag reports 35 existing issues").
go-vet-tagged:
  extends: .go-base
  stage: test
  script:
    - packages=$(bash scripts/tagged-test-packages.sh integration e2e)
    - go vet -tags integration,e2e $packages

# `make test-e2e`: the built CLI and a headless Chromium (.packmon-test-tools sets PACKMON_BROWSER_BIN). The browser
# test skips when it finds no browser, and a skip must not pass as coverage: the job fails on any skipped test
# (scripts/fail-on-skipped-tests.sh; tests/ci tests the script and pins these lines).
go-test-e2e:
  extends: [.go-base, .packmon-test-tools]
  stage: test
  script:
    - make build
    - packages=$(bash scripts/tagged-test-packages.sh e2e)
    - |
      status=0
      PACKMON_TEST_BIN_DIR="$CI_PROJECT_DIR" go test -count=1 -v -timeout=10m -tags e2e $packages > /tmp/e2e-test.log 2>&1 || status=1
      cat /tmp/e2e-test.log
      bash scripts/fail-on-skipped-tests.sh /tmp/e2e-test.log || status=1
      exit "$status"

# `make test-integration` against two PostgreSQL services instead of per-test `docker run` containers (the runners
# have no Docker daemon). The harnesses read PACKMON_TEST_POSTGRES_URL / PACKMON_TEST_POSTGRES_PLAIN_URL and reset
# the server like a fresh container for every test, so the packages run one at a time (-p 1). The services start
# exactly like the harness containers: same image, same user, and the same -c options for the preloaded one; the
# throwaway password belongs to job-local services without a published port. Tests that need a Docker daemon are
# skipped by name from .gitlab/integration-docker-only.txt (each with its reason) through
# scripts/integration-skip-pattern.sh; tests/ci tests the script and pins -p 1 and -skip.
# Every push: the run takes about 3 minutes (local measurement 2026-11-26, TESTING.md "CI integration and e2e
# jobs"), comparable to go-test-race.
go-test-integration:
  extends: .go-base
  stage: test
  services:
    - name: &packmon-test-postgres-image cgr.dev/chainguard/postgres:18@sha256:f4b066118f70efeb519d2aac94507f898698f4a145ecb43dd8fd4076f21b1124
      alias: postgres
      command:
        - "-c"
        - "shared_preload_libraries=pg_stat_statements"
        - "-c"
        - "compute_query_id=on"
        - "-c"
        - "track_io_timing=on"
        - "-c"
        - "pg_stat_statements.track=top"
        - "-c"
        - "pg_stat_statements.track_utility=off"
      variables: &packmon-test-postgres-env
        POSTGRES_DB: packmon
        POSTGRES_USER: packmon
        POSTGRES_PASSWORD: packmon
    - name: *packmon-test-postgres-image
      alias: postgres-plain
      variables: *packmon-test-postgres-env
  variables:
    PACKMON_TEST_POSTGRES_URL: postgres://packmon:packmon@postgres:5432/postgres?sslmode=disable
    PACKMON_TEST_POSTGRES_PLAIN_URL: postgres://packmon:packmon@postgres-plain:5432/postgres?sslmode=disable
  script:
    - make build build-server
    - packages=$(bash scripts/tagged-test-packages.sh integration)
    - skip_pattern=$(bash scripts/integration-skip-pattern.sh)
    - PACKMON_TEST_BIN_DIR="$CI_PROJECT_DIR" go test -count=1 -p 1 -timeout=30m -tags integration -skip "$skip_pattern" $packages

# The remaining gates of `make verify` that no template job runs. Each repeats its Makefile recipe with the
# Makefile's pins (tests/ci TestGitLabLocalGateJobsMatchMakefilePins), as a separate job so one finding never
# hides another. Gates the pipeline already covers: golangci-lint ./... (also the gofumpt formatter of
# .golangci.yml), go vet, go test (tests/ci included) and -race, govulncheck, lint:web and lint:openapi
# (node-check), the image scan of security-images (container-scan).

# lint-shell. The image carries the Makefile's exact release tag (no line tag exists, see the Makefile).
shellcheck:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  needs: []
  script:
    - shellcheck --version
    - shellcheck scripts/*.sh scripts/lib/*.sh deploy/n8n/*.sh

# lint-docker, reading the Dockerfile from stdin like the Makefile.
hadolint:
  stage: lint
  image:
    name: hadolint/hadolint:v2.15.1-alpine
    entrypoint: [""]
  needs: []
  script:
    - hadolint --version
    - hadolint - < Dockerfile

# lint-nongo: line endings, final newlines and trailing whitespace of the non-Go files.
non-go-format:
  extends: .go-base
  stage: lint
  needs: []
  script:
    - make lint-nongo

# lint-powershell. Microsoft no longer rebuilds the MCR PowerShell images (7.5-ubuntu-24.04 still ships 7.5.0), so
# the job installs the current release from its official tarball, checked against the SHA-256 GitHub publishes for
# that asset; a new release is a deliberate bump of both variables, like NODE_VERSION above. ErrorActionPreference
# Stop ends the run at the first error of the module install or the analysis.
psscriptanalyzer:
  stage: lint
  image: debian:trixie-slim
  needs: []
  variables:
    PWSH_VERSION: "7.7.0"
    PWSH_SHA256: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
    DEBIAN_FRONTEND: noninteractive
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl libicu76 >/dev/null
    - |
      pwsh_dir="$(mktemp -d)"
      curl -fsSLo "$pwsh_dir/pwsh.tar.gz" "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz"
      echo "${PWSH_SHA256}  $pwsh_dir/pwsh.tar.gz" | sha256sum -c -
      tar -xzf "$pwsh_dir/pwsh.tar.gz" -C "$pwsh_dir"
      chmod +x "$pwsh_dir/pwsh"
      export PATH="$pwsh_dir:$PATH"
    - >-
      pwsh -NoLogo -NoProfile -Command "\$ErrorActionPreference = 'Stop';
      \$PSVersionTable.PSVersion.ToString();
      Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force;
      \$findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error;
      if (\$findings) { \$findings; exit 1 }"

# The 79.5 % total coverage floor `make test` enforces, on the coverage.out of go-test.
go-coverage-gate:
  extends: .go-base
  stage: lint
  needs:
    - job: go-test
      artifacts: true
  script:
    - go run ./tools/checkcoverage -profile=coverage.out -min=79.5

# The gosec run of `make security`, with its #nosec discipline (golangci-lint's gosec does not enforce it).
gosec:
  extends: .go-base
  stage: security
  needs: []
  script:
    - go run github.com/securego/gosec/v2/cmd/gosec@latest -nosec-require-rules -nosec-require-justification $(go list -f '{{.Dir}}' ./...)

# The library scan of `make security` (go.mod and package-lock.json); --pkg-types replaces the deprecated
# --vuln-type of the Makefile.
trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
  script:
    - trivy --version
    - trivy fs --scanners vuln --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs .gotmp,.build .

# `make security` audits every dependency, dev tooling included; the template job omits the dev dependencies.
npm-audit:
  script:
    - cd "$NODE_DIR"
    - npm audit --audit-level=high
