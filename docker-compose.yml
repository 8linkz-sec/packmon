x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${PACKMON_POSTGRES_IMAGE:-cgr.dev/chainguard/postgres:18@sha256:891139a6d9036632791857fb7585425f1bf0c64516fc52bc39da94305ee92461}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Keep the actual PostgreSQL cluster inside the named compose volume.
      # Postgres 18 images default to a versioned path under /var/lib/postgresql,
      # which can otherwise fall back to an anonymous Docker volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # restart: unless-stopped

  packmon-server:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${PACKMON_VERSION:-dev}
        COMMIT: ${PACKMON_COMMIT:-none}
        DATE: ${PACKMON_BUILD_DATE:-unknown}
        PACKMON_GO_BUILDER_IMAGE: ${PACKMON_GO_BUILDER_IMAGE:-golang:1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc}
        PACKMON_ALPINE_RUNTIME_IMAGE: ${PACKMON_ALPINE_RUNTIME_IMAGE:-alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    ports:
      - "127.0.0.1:${PACKMON_SERVER_PORT:-8080}:${PACKMON_SERVER_PORT:-8080}"
      - "127.0.0.1:${PACKMON_METRICS_PORT:-9090}:${PACKMON_METRICS_PORT:-9090}"
    environment:
      PACKMON_SERVER_MODE: ${PACKMON_SERVER_MODE:-production}
      PACKMON_SERVER_PORT: ${PACKMON_SERVER_PORT:-8080}
      PACKMON_SERVER_PUBLIC_HOST: ${PACKMON_SERVER_PUBLIC_HOST:-localhost:8080}
      PACKMON_TLS_CERT_FILE: ${PACKMON_TLS_CERT_FILE:-}
      PACKMON_TLS_KEY_FILE: ${PACKMON_TLS_KEY_FILE:-}
      PACKMON_TLS_MIN_VERSION: ${PACKMON_TLS_MIN_VERSION:-1.2}
      PACKMON_TRUSTED_PROXIES: ${PACKMON_TRUSTED_PROXIES:-}
      PACKMON_ALLOW_INSECURE_LOCAL_HTTP: ${PACKMON_ALLOW_INSECURE_LOCAL_HTTP:-false}
      PACKMON_INSECURE_LOCAL_HTTP_BIND_MODE: ${PACKMON_INSECURE_LOCAL_HTTP_BIND_MODE:-container}
      PACKMON_METRICS_HOST: ${PACKMON_METRICS_HOST:-127.0.0.1}
      PACKMON_METRICS_PORT: ${PACKMON_METRICS_PORT:-9090}
      PACKMON_SERVER_READ_TIMEOUT: ${PACKMON_SERVER_READ_TIMEOUT:-30s}
      PACKMON_SERVER_WRITE_TIMEOUT: ${PACKMON_SERVER_WRITE_TIMEOUT:-30s}
      PACKMON_SERVER_SHUTDOWN_TIMEOUT: ${PACKMON_SERVER_SHUTDOWN_TIMEOUT:-15s}
      PACKMON_BLOCK_THRESHOLD: ${PACKMON_BLOCK_THRESHOLD:-CRITICAL}
      PACKMON_RATE_LIMIT_PER_MINUTE: ${PACKMON_RATE_LIMIT_PER_MINUTE:-120}
      PACKMON_RATE_LIMIT_BURST: ${PACKMON_RATE_LIMIT_BURST:-60}
      PACKMON_WEB_PRIVACY_URL: ${PACKMON_WEB_PRIVACY_URL:-/privacy}
      PACKMON_WEB_LEGAL_URL: ${PACKMON_WEB_LEGAL_URL:-}
      PACKMON_DB_HOST: ${PACKMON_DB_HOST:-postgres}
      PACKMON_DB_PORT: ${PACKMON_DB_PORT:-5432}
      PACKMON_DB_NAME: ${PACKMON_DB_NAME:-packmon}
      PACKMON_DB_USER: ${PACKMON_DB_USER:-packmon}
      PACKMON_DB_PASSWORD: ${PACKMON_DB_PASSWORD:-}
      PACKMON_DB_SSLMODE: ${PACKMON_DB_SSLMODE:-disable}
      PACKMON_DB_MAX_CONNS: ${PACKMON_DB_MAX_CONNS:-20}
      PACKMON_DB_MIN_CONNS: ${PACKMON_DB_MIN_CONNS:-2}
      PACKMON_DB_CONNECT_TIMEOUT: ${PACKMON_DB_CONNECT_TIMEOUT:-10s}
      PACKMON_LOG_LEVEL: ${PACKMON_LOG_LEVEL:-info}
      PACKMON_LOG_FORMAT: ${PACKMON_LOG_FORMAT:-json}
      PACKMON_ADMIN_INITIAL_PASSWORD: ${PACKMON_ADMIN_INITIAL_PASSWORD:-}
      PACKMON_ADMIN_SESSION_TIMEOUT: ${PACKMON_ADMIN_SESSION_TIMEOUT:-8h}
      PACKMON_ADMIN_IDLE_TIMEOUT: ${PACKMON_ADMIN_IDLE_TIMEOUT:-15m}
      PACKMON_ENCRYPTION_KEY: ${PACKMON_ENCRYPTION_KEY:-}
      PACKMON_ADMIN_AUDIT_HMAC_KEY: ${PACKMON_ADMIN_AUDIT_HMAC_KEY:-}
      PACKMON_SCAN_LOG_RETENTION: ${PACKMON_SCAN_LOG_RETENTION:-2160h}
      PACKMON_ADMIN_AUDIT_LOG_RETENTION: ${PACKMON_ADMIN_AUDIT_LOG_RETENTION:-8760h}
      PACKMON_REFRESH_QUEUE_RETENTION: ${PACKMON_REFRESH_QUEUE_RETENTION:-720h}
      PACKMON_PACKAGE_CHECK_STATUS_RETENTION: ${PACKMON_PACKAGE_CHECK_STATUS_RETENTION:-2160h}
      PACKMON_AUDIT_RETENTION_INTERVAL: ${PACKMON_AUDIT_RETENTION_INTERVAL:-24h}
      PACKMON_FEED_SYNC_INTERVAL: ${PACKMON_FEED_SYNC_INTERVAL:-8h}
      PACKMON_FEED_SYNC_ON_STARTUP: ${PACKMON_FEED_SYNC_ON_STARTUP:-true}
      PACKMON_FEED_DATA_DIR: ${PACKMON_FEED_DATA_DIR:-/data/feeds}
      PACKMON_FEED_IMPORT_SECRET: ${PACKMON_FEED_IMPORT_SECRET:-}
      PACKMON_FEED_OSV_ENABLED: ${PACKMON_FEED_OSV_ENABLED:-true}
      PACKMON_FEED_GHSA_ENABLED: ${PACKMON_FEED_GHSA_ENABLED:-true}
      PACKMON_FEED_OPENSSF_ENABLED: ${PACKMON_FEED_OPENSSF_ENABLED:-true}
      PACKMON_FEED_VULNCHECK_ENABLED: ${PACKMON_FEED_VULNCHECK_ENABLED:-false}
      PACKMON_FEED_NVD_ENABLED: ${PACKMON_FEED_NVD_ENABLED:-true}
      PACKMON_FEED_CISAKEV_ENABLED: ${PACKMON_FEED_CISAKEV_ENABLED:-true}
      PACKMON_FEED_EPSS_ENABLED: ${PACKMON_FEED_EPSS_ENABLED:-true}
      PACKMON_FEED_ENDOFLIFE_ENABLED: ${PACKMON_FEED_ENDOFLIFE_ENABLED:-true}
      PACKMON_FEED_SOCKET_ENABLED: ${PACKMON_FEED_SOCKET_ENABLED:-false}
      PACKMON_FEED_REVERSINGLABS_ENABLED: ${PACKMON_FEED_REVERSINGLABS_ENABLED:-false}
      PACKMON_FEED_OSV_MODE: ${PACKMON_FEED_OSV_MODE:-self}
      PACKMON_FEED_GHSA_MODE: ${PACKMON_FEED_GHSA_MODE:-self}
      PACKMON_FEED_OPENSSF_MODE: ${PACKMON_FEED_OPENSSF_MODE:-self}
      PACKMON_FEED_VULNCHECK_MODE: ${PACKMON_FEED_VULNCHECK_MODE:-self}
      PACKMON_FEED_CISAKEV_MODE: ${PACKMON_FEED_CISAKEV_MODE:-self}
      PACKMON_FEED_EPSS_MODE: ${PACKMON_FEED_EPSS_MODE:-self}
      PACKMON_FEED_NVD_MODE: ${PACKMON_FEED_NVD_MODE:-self}
      PACKMON_FEED_ENDOFLIFE_MODE: ${PACKMON_FEED_ENDOFLIFE_MODE:-self}
      PACKMON_FEED_SOCKET_MODE: ${PACKMON_FEED_SOCKET_MODE:-self}
      PACKMON_FEED_REVERSINGLABS_MODE: ${PACKMON_FEED_REVERSINGLABS_MODE:-self}
      PACKMON_FEED_OSV_BASE_URL: ${PACKMON_FEED_OSV_BASE_URL:-https://osv-vulnerabilities.storage.googleapis.com}
      PACKMON_FEED_GHSA_REPO_URL: ${PACKMON_FEED_GHSA_REPO_URL:-https://github.com/github/advisory-database.git}
      PACKMON_FEED_OPENSSF_REPO_URL: ${PACKMON_FEED_OPENSSF_REPO_URL:-https://github.com/ossf/malicious-packages.git}
      PACKMON_FEED_CISAKEV_CATALOG_URL: ${PACKMON_FEED_CISAKEV_CATALOG_URL:-https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
      PACKMON_FEED_EPSS_SCORES_URL: ${PACKMON_FEED_EPSS_SCORES_URL:-https://epss.cyentia.com/epss_scores-current.csv.gz}
      PACKMON_FEED_NVD_API_URL: ${PACKMON_FEED_NVD_API_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      PACKMON_ENDOFLIFE_API_BASE_URL: ${PACKMON_ENDOFLIFE_API_BASE_URL:-https://endoflife.date/api/v1}
      PACKMON_VULNCHECK_API_KEY: ${PACKMON_VULNCHECK_API_KEY:-}
      PACKMON_NVD_API_KEY: ${PACKMON_NVD_API_KEY:-}
      PACKMON_SOCKET_API_KEY: ${PACKMON_SOCKET_API_KEY:-}
      PACKMON_SOCKET_EXCLUDED_NAMESPACES: ${PACKMON_SOCKET_EXCLUDED_NAMESPACES:-}
      PACKMON_REVERSINGLABS_API_KEY: ${PACKMON_REVERSINGLABS_API_KEY:-}
      PACKMON_REVERSINGLABS_API_BASE_URL: ${PACKMON_REVERSINGLABS_API_BASE_URL:-https://data.reversinglabs.com/api/oss/community/v2/free}
      PACKMON_REVERSINGLABS_LOOKUP_TTL: ${PACKMON_REVERSINGLABS_LOOKUP_TTL:-24h}
      PACKMON_REVERSINGLABS_BATCH_SIZE: ${PACKMON_REVERSINGLABS_BATCH_SIZE:-5}
      PACKMON_REVERSINGLABS_MAX_SCHEDULE_PER_CHECK: ${PACKMON_REVERSINGLABS_MAX_SCHEDULE_PER_CHECK:-100}
      PACKMON_REVERSINGLABS_CACHE_RETENTION: ${PACKMON_REVERSINGLABS_CACHE_RETENTION:-168h}
      PACKMON_REVERSINGLABS_EXCLUDED_NAMESPACES: ${PACKMON_REVERSINGLABS_EXCLUDED_NAMESPACES:-}
    volumes:
      # Feed working data, including the git checkouts of the GHSA advisory
      # database and the OpenSSF malicious-packages repo. Without this the
      # checkouts live in the container layer and every image rebuild forces
      # a full re-clone of ~350k files, which is the slowest and most
      # failure-prone thing the server does.
      - feed-data:/data/feeds
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    stop_grace_period: 25s
    # restart: unless-stopped

  packmon-migrate:
    profiles: ["manual"]
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${PACKMON_VERSION:-dev}
        COMMIT: ${PACKMON_COMMIT:-none}
        DATE: ${PACKMON_BUILD_DATE:-unknown}
        PACKMON_GO_BUILDER_IMAGE: ${PACKMON_GO_BUILDER_IMAGE:-golang:1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc}
        PACKMON_ALPINE_RUNTIME_IMAGE: ${PACKMON_ALPINE_RUNTIME_IMAGE:-alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    command: ["migrate"]
    environment:
      PACKMON_DB_HOST: ${PACKMON_DB_HOST:-postgres}
      PACKMON_DB_PORT: ${PACKMON_DB_PORT:-5432}
      PACKMON_DB_NAME: ${PACKMON_DB_NAME:-packmon}
      PACKMON_DB_USER: ${PACKMON_DB_USER:-packmon}
      PACKMON_DB_PASSWORD: ${PACKMON_DB_PASSWORD:-}
      PACKMON_DB_SSLMODE: ${PACKMON_DB_SSLMODE:-disable}
      PACKMON_DB_CONNECT_TIMEOUT: ${PACKMON_DB_CONNECT_TIMEOUT:-10s}
      PACKMON_LOG_LEVEL: ${PACKMON_LOG_LEVEL:-info}
      PACKMON_LOG_FORMAT: ${PACKMON_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # restart: "no"

  packmon-backup:
    profiles: ["manual"]
    image: ${PACKMON_POSTGRES_IMAGE:-cgr.dev/chainguard/postgres:18@sha256:891139a6d9036632791857fb7585425f1bf0c64516fc52bc39da94305ee92461}
    logging: *default-logging
    environment:
      PGHOST: ${PACKMON_DB_HOST:-postgres}
      PGPORT: ${PACKMON_DB_PORT:-5432}
      PGDATABASE: ${PACKMON_DB_NAME:-packmon}
      PGUSER: ${PACKMON_DB_USER:-packmon}
      PGPASSWORD: ${PACKMON_DB_PASSWORD:-}
    volumes:
      - "${PACKMON_BACKUP_DIR:-./backups}:/backups/packmon"
    command:
      - sh
      - -ec
      - |
        install -d -m 0700 /backups/packmon
        dump="/backups/packmon/packmon-$$(date -u +%Y%m%d-%H%M%S).dump"
        pg_dump --format=custom --file "$$dump"
        pg_restore --list "$$dump" >/dev/null
        find /backups/packmon -type f -name 'packmon-*.dump' -mtime +7 -delete
    depends_on:
      postgres:
        condition: service_healthy
    # restart: "no"

volumes:
  postgres-data:
  feed-data:
