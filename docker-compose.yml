services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Keep the actual PostgreSQL cluster inside the named compose volume.
      # Postgres 18 images default to a versioned path under /var/lib/postgresql,
      # which can otherwise fall back to an anonymous Docker volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ["migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  packmon-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      PACKMON_SERVER_MODE: production
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: packmon-postgres-data
