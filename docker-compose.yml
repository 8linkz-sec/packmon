services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:891139a6d9036632791857fb7585425f1bf0c64516fc52bc39da94305ee92461
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Keep the actual PostgreSQL cluster inside the named compose volume.
      # Postgres 18 images default to a versioned path under /var/lib/postgresql,
      # which can otherwise fall back to an anonymous Docker volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    restart: unless-stopped

  packmon-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${PACKMON_VERSION:-dev}
        COMMIT: ${PACKMON_COMMIT:-none}
        DATE: ${PACKMON_BUILD_DATE:-unknown}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    env_file: .env
    environment:
      PACKMON_DB_PASSWORD: ${PACKMON_DB_PASSWORD:?PACKMON_DB_PASSWORD is required}
      PACKMON_ADMIN_INITIAL_PASSWORD: ${PACKMON_ADMIN_INITIAL_PASSWORD:?PACKMON_ADMIN_INITIAL_PASSWORD is required}
      PACKMON_ENCRYPTION_KEY: ${PACKMON_ENCRYPTION_KEY:?PACKMON_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    stop_grace_period: 10s
    restart: unless-stopped

  packmon-migrate:
    profiles: ["manual"]
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${PACKMON_VERSION:-dev}
        COMMIT: ${PACKMON_COMMIT:-none}
        DATE: ${PACKMON_BUILD_DATE:-unknown}
    command: ["migrate"]
    environment:
      PACKMON_DB_HOST: ${PACKMON_DB_HOST:-postgres}
      PACKMON_DB_PORT: ${PACKMON_DB_PORT:-5432}
      PACKMON_DB_NAME: ${PACKMON_DB_NAME:-packmon}
      PACKMON_DB_USER: ${PACKMON_DB_USER:-packmon}
      PACKMON_DB_PASSWORD: ${PACKMON_DB_PASSWORD:?PACKMON_DB_PASSWORD is required}
      PACKMON_DB_SSLMODE: ${PACKMON_DB_SSLMODE:-disable}
      PACKMON_DB_CONNECT_TIMEOUT: ${PACKMON_DB_CONNECT_TIMEOUT:-10s}
      PACKMON_LOG_LEVEL: ${PACKMON_LOG_LEVEL:-info}
      PACKMON_LOG_FORMAT: ${PACKMON_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
    name: packmon-postgres-data
