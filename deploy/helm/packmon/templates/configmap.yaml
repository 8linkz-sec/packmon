apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "packmon.fullname" . }}-config
  labels:
    {{- include "packmon.labels" . | nindent 4 }}
data:
  PACKMON_SERVER_MODE: {{ .Values.server.mode | quote }}
  PACKMON_SERVER_PORT: {{ .Values.server.port | quote }}
  PACKMON_SERVER_PUBLIC_HOST: {{ .Values.server.publicHost | quote }}
  PACKMON_TRUSTED_PROXIES: {{ join "," .Values.server.trustedProxies | quote }}
  PACKMON_ALLOW_INSECURE_LOCAL_HTTP: {{ .Values.server.allowInsecureLocalHTTP | quote }}
  PACKMON_TLS_CERT_FILE: {{ .Values.server.tls.certFile | quote }}
  PACKMON_TLS_KEY_FILE: {{ .Values.server.tls.keyFile | quote }}
  PACKMON_TLS_MIN_VERSION: {{ .Values.server.tls.minVersion | quote }}
  PACKMON_SERVER_READ_TIMEOUT: {{ .Values.server.readTimeout | quote }}
  PACKMON_SERVER_WRITE_TIMEOUT: {{ .Values.server.writeTimeout | quote }}
  PACKMON_SERVER_SHUTDOWN_TIMEOUT: {{ .Values.server.shutdownTimeout | quote }}
  PACKMON_METRICS_HOST: {{ .Values.metrics.host | quote }}
  PACKMON_METRICS_PORT: {{ .Values.metrics.port | quote }}
  PACKMON_ADMIN_SESSION_TIMEOUT: {{ .Values.admin.sessionTimeout | quote }}
  PACKMON_FEED_SYNC_INTERVAL: {{ .Values.feeds.syncInterval | quote }}
  PACKMON_FEED_SYNC_ON_STARTUP: {{ .Values.feeds.syncOnStartup | quote }}
  PACKMON_FEED_DATA_DIR: {{ .Values.feeds.dataDir | quote }}
  PACKMON_FEED_OSV_ENABLED: {{ .Values.feeds.osvEnabled | quote }}
  PACKMON_FEED_GHSA_ENABLED: {{ .Values.feeds.ghsaEnabled | quote }}
  PACKMON_FEED_OPENSSF_ENABLED: {{ .Values.feeds.openssfEnabled | quote }}
  PACKMON_FEED_VULNCHECK_ENABLED: {{ .Values.feeds.vulncheckEnabled | quote }}
  PACKMON_FEED_NVD_ENABLED: {{ .Values.feeds.nvdEnabled | quote }}
  PACKMON_FEED_SOCKET_ENABLED: {{ .Values.feeds.socketEnabled | quote }}
  PACKMON_FEED_REVERSINGLABS_ENABLED: {{ .Values.feeds.reversinglabsEnabled | quote }}
  PACKMON_FEED_CISAKEV_ENABLED: {{ .Values.feeds.cisakevEnabled | quote }}
  PACKMON_FEED_EPSS_ENABLED: {{ .Values.feeds.epssEnabled | quote }}
  PACKMON_FEED_ENDOFLIFE_ENABLED: {{ .Values.feeds.endoflifeEnabled | quote }}
  PACKMON_FEED_OSV_MODE: {{ .Values.feeds.osvMode | quote }}
  PACKMON_FEED_GHSA_MODE: {{ .Values.feeds.ghsaMode | quote }}
  PACKMON_FEED_OPENSSF_MODE: {{ .Values.feeds.openssfMode | quote }}
  PACKMON_FEED_VULNCHECK_MODE: {{ .Values.feeds.vulncheckMode | quote }}
  PACKMON_FEED_NVD_MODE: {{ .Values.feeds.nvdMode | quote }}
  PACKMON_FEED_SOCKET_MODE: {{ .Values.feeds.socketMode | quote }}
  PACKMON_FEED_REVERSINGLABS_MODE: {{ .Values.feeds.reversinglabsMode | quote }}
  PACKMON_FEED_CISAKEV_MODE: {{ .Values.feeds.cisakevMode | quote }}
  PACKMON_FEED_EPSS_MODE: {{ .Values.feeds.epssMode | quote }}
  PACKMON_FEED_ENDOFLIFE_MODE: {{ .Values.feeds.endoflifeMode | quote }}
  PACKMON_REVERSINGLABS_API_BASE_URL: {{ .Values.feeds.reversinglabsBaseUrl | quote }}
  PACKMON_REVERSINGLABS_LOOKUP_TTL: {{ .Values.feeds.reversinglabsLookupTtl | quote }}
  PACKMON_REVERSINGLABS_BATCH_SIZE: {{ .Values.feeds.reversinglabsBatchSize | quote }}
  PACKMON_ENDOFLIFE_API_BASE_URL: {{ .Values.feeds.endoflifeBaseUrl | quote }}
  PACKMON_DB_PORT: {{ ternary "5432" (.Values.externalDatabase.port | toString) .Values.postgresql.enabled | quote }}
  PACKMON_DB_NAME: {{ ternary .Values.postgresql.database .Values.externalDatabase.name .Values.postgresql.enabled | quote }}
  PACKMON_DB_USER: {{ ternary .Values.postgresql.user .Values.externalDatabase.user .Values.postgresql.enabled | quote }}
  PACKMON_DB_HOST: {{ ternary (printf "%s-postgresql" (include "packmon.fullname" .)) .Values.externalDatabase.host .Values.postgresql.enabled | quote }}
  PACKMON_DB_SSLMODE: {{ ternary "disable" .Values.externalDatabase.sslmode .Values.postgresql.enabled | quote }}
