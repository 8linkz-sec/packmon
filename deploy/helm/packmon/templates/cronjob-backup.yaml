{{- if and .Values.backup.enabled .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "packmon.fullname" . }}-backup
  labels:
    {{- include "packmon.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "packmon.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.postgresqlSecurityContext | nindent 12 }}
          containers:
            - name: pg-dump
              image: {{ .Values.backup.image | quote }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "packmon.fullname" . }}-secret
                      key: db-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p {{ .Values.backup.path | quote }}
                  target="{{ .Values.backup.path }}/packmon-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -h {{ include "packmon.fullname" . }}-postgresql -U {{ .Values.postgresql.user }} -d {{ .Values.postgresql.database }} -Fc -f "${target}"
                  find {{ .Values.backup.path }} -type f -name 'packmon-*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
              volumeMounts:
                - name: backup
                  mountPath: {{ .Values.backup.path }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "packmon.fullname" . }}-backup
{{- end }}
