{{define "title"}}Page not found - Packmon{{end}}

    <p class="mt-3 text-base text-fg">

      <a href="/search" class="inline-flex min-h-11 items-center rounded-md border border-muted bg-surface px-4 py-2 text-sm font-medium text-fg transition hover:bg-surface-2">

      </a>
      <a href="/feeds" class="inline-flex min-h-11 items-center rounded-md border border-muted bg-surface px-4 py-2 text-sm font-medium text-fg transition hover:bg-surface-2">

      <a href="/admin/" class="inline-flex min-h-11 items-center rounded-md border border-muted bg-surface px-4 py-2 text-sm font-medium text-fg transition hover:bg-surface-2">
