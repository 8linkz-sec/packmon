{{define "title"}}Packmon - Admin Login{{end}}

{{define "nav"}}
<nav class="bg-gray-900 text-white shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">
      <a href="/" class="text-lg font-bold tracking-tight hover:text-gray-300">Packmon</a>
    </div>
  </div>
</nav>
{{end}}

{{define "content"}}
<div class="max-w-md mx-auto mt-16">
  <div class="bg-white rounded-lg shadow-lg p-8 border border-gray-200">
    <h1 class="text-xl font-bold text-center mb-6">Admin Login</h1>

    {{if .Error}}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-md px-4 py-3 mb-4 text-sm">
      {{.Error}}
    </div>
    {{end}}

    <form action="/admin/login" method="POST" class="space-y-4">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input
          type="text"
          name="username"
          id="username"
          autocomplete="username"
          required
          value="admin"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          autocomplete="current-password"
          required
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        Login
      </button>
    </form>
  </div>
</div>
{{end}}
