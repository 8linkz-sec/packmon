{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Packmon{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.7"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  {{block "nav" .}}
  <nav class="bg-black text-white shadow">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center space-x-8">
          <a href="/" class="text-lg font-bold tracking-tight hover:text-gray-300">Packmon</a>
          <div class="hidden sm:flex space-x-4 text-sm">
            <a href="/" class="hover:text-gray-300 px-2 py-1 rounded {{if eq .ActiveNav "dashboard"}}bg-gray-700{{end}}">Dashboard</a>
            <a href="/search" class="hover:text-gray-300 px-2 py-1 rounded {{if eq .ActiveNav "search"}}bg-gray-700{{end}}">Search</a>
            <a href="/scans" class="hover:text-gray-300 px-2 py-1 rounded {{if eq .ActiveNav "scans"}}bg-gray-700{{end}}">Scans</a>
            <a href="/feeds" class="hover:text-gray-300 px-2 py-1 rounded {{if eq .ActiveNav "feeds"}}bg-gray-700{{end}}">Feed Status</a>
          </div>
        </div>
        <div class="flex items-center space-x-4 text-sm">
          <a href="/admin/" class="hover:text-gray-300 px-2 py-1 rounded {{if eq .ActiveNav "admin"}}bg-gray-700{{end}}">Admin</a>
        </div>
      </div>
    </div>
  </nav>
  {{end}}

  <main class="flex-1 max-w-[1700px] mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    {{block "content" .}}{{end}}
  </main>

  <footer class="bg-gray-100 border-t border-gray-200 mt-auto">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-6 lg:px-8 py-3 text-center text-xs text-gray-500">
      Packmon Dependency Scanner
    </div>
  </footer>

</body>
</html>
{{end}}
