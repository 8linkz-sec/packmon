# Read by sonar-scanner in the GitLab CI sonarqube job (8linkz-sec/ci-templates templates/sonarqube.yml) in
# addition to the -D options of that job. Scope options stay in SONAR_EXTRA_ARGS in .gitlab-ci.yml; this file
# holds only what the templates have no variable for.
#
# Accepted findings, each ignored for one rule in one file only (decided 2026-11-26):
#   s9423style -- css:S9423 in style.css: the prefers-reduced-motion reset keeps !important. Its universal (*)
#     selector has zero specificity and must still beat every component transition. Every other !important
#     was resolved by specificity; internal/web TestCustomStylesKeepImportantOnlyInReducedMotionReset keeps
#     new !important declarations out of the rest of the file.
#   s1874unload -- javascript:S1874 in form-actions.js: the unsaved-changes guard sets the deprecated
#     BeforeUnloadEvent.returnValue because Chrome/Edge before 119 (the UI baseline is Chrome 111+) show the
#     leave-page dialog only when it is set; preventDefault() alone is not enough there.
sonar.issue.ignore.multicriteria=s9423style,s1874unload
sonar.issue.ignore.multicriteria.s9423style.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.s9423style.resourceKey=internal/web/static/style.css
sonar.issue.ignore.multicriteria.s1874unload.ruleKey=javascript:S1874
sonar.issue.ignore.multicriteria.s1874unload.resourceKey=internal/web/static/form-actions.js
