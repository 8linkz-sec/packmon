# Repository-specific SonarQube settings. Read by sonar-scanner in the GitLab CI sonarqube job
# (8linkz-sec/ci-templates templates/sonarqube.yml) in addition to the -D options of that job. Scope options stay
# in SONAR_EXTRA_ARGS in .gitlab-ci.yml; this file holds only what the templates have no variable for. Never set
# sonar.issue.ignore.multicriteria through a -D option: it would replace this whole list.
#
# Documented false positives and accepted findings. Every entry is one rule in one file.
sonar.issue.ignore.multicriteria=gos107fuzz,s6845a,s6845b,s6845c,s6845d,s6845e,s6845f,s6845g,s6845h,s6845i,s6845j,s6845k,s6845l,s6845m

# go:S107 (too many parameters) on the FuzzRedactDiagnosticMessageSecretFields fuzz target: testing.F.Fuzz
# requires every fuzzed input as its own scalar parameter (no structs), so the function cannot take fewer
# parameters without packing independent selectors into one integer and losing a readable seed corpus.
sonar.issue.ignore.multicriteria.gos107fuzz.ruleKey=go:S107
sonar.issue.ignore.multicriteria.gos107fuzz.resourceKey=internal/logsafe/secret_fields_test.go

# Accepted finding Web:S6845 ("tabindex" on a non-interactive element), limited to the template files whose
# only tabindex="0" sites are keyboard-focusable scrollable regions: the horizontally scrollable table regions
# (<section class="pm-scroll-region">) and the scrollable feed error text (<pre class="... overflow-auto">).
# DESIGN.md "Web UI" requires these regions to be keyboard-focusable so wide tables and long diagnostics can be
# scrolled with the keyboard; removing the tabindex would drop that behaviour. Sonar can only ignore per file,
# so internal/web TestFocusableNonInteractiveElementsAreScrollableRegionsListedInSonarExclusion keeps every
# such site a scrollable region and keeps this list equal to exactly the files that contain one.
# Decided 2026-11-26, same rationale as collector-controller sonar-project.properties entry e1.
sonar.issue.ignore.multicriteria.s6845a.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.s6845a.resourceKey=internal/web/templates/admin/advisories.html
sonar.issue.ignore.multicriteria.s6845b.ruleKey=Web:S6845
