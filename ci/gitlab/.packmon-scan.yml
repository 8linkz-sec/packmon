# GitLab CI shared template for Packmon dependency scanning.
#
# Include in your project's .gitlab-ci.yml:
#
#   include:
#     - project: 'security/packmon'
#       ref: main
#       file: '/ci/gitlab/.packmon-scan.yml'
#
# Override variables as needed:
#
#   variables:
#     PACKMON_FAIL_ON: "HIGH"
#
# Binary source: GitHub Releases by default, override PACKMON_BINARY_MIRROR
# for internal mirrors (DE-22).

variables:
  PACKMON_FAIL_ON: "CRITICAL"
  PACKMON_SCAN_PATH: "."
  PACKMON_SERVER: "https://packmon.intern"
  PACKMON_BINARY_URL: "${PACKMON_BINARY_MIRROR:-https://github.com/8linkz-sec/packmon/releases/latest/download}"

packmon:
  image: alpine:3.23
  stage: test
  before_script:
    - apk add --no-cache curl jq
    - |
      ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      BINARY_URL="${PACKMON_BINARY_URL}/packmon-linux-${ARCH}"
      echo "Downloading packmon from ${BINARY_URL}"
      curl -sfL "${BINARY_URL}" -o /usr/local/bin/packmon
      chmod +x /usr/local/bin/packmon
      packmon version
  script:
    - |
      set +e
      packmon scan "$PACKMON_SCAN_PATH" \
        --fail-on "$PACKMON_FAIL_ON" \
        --mode remote \
        --server "$PACKMON_SERVER" \
        --output-json results.json \
        --output-junit results.xml \
        --output-sarif results.sarif
      EXIT_CODE=$?
      set -e

      echo "Packmon exit code: ${EXIT_CODE}"
      if [ -f results.json ]; then
        jq -r '"Packages scanned: \(.packages_scanned), Findings: \(.findings_count)"' results.json
      fi

      exit $EXIT_CODE
  artifacts:
    when: always
    paths:
      - results.json
      - results.sarif
    reports:
      junit: results.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: false
