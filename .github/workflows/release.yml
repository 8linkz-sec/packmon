name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version/tag to release (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release version
        run: |
          set -euo pipefail
          # On a tag push use the tag name; on manual dispatch use the input.
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
          fi
          if [ -z "${RELEASE_VERSION}" ]; then
            echo "release version could not be determined" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.4"

      - name: Build all targets
        run: |
          VERSION="${RELEASE_VERSION}"
          COMMIT=${GITHUB_SHA::8}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          declare -a TARGETS=(
            "linux:amd64"
            "linux:arm64"
            "darwin:amd64"
            "darwin:arm64"
            "windows:amd64"
            "windows:arm64"
          )

          mkdir -p dist

          for target in "${TARGETS[@]}"; do
            IFS=':' read -r os arch <<< "$target"
            SUFFIX=""
            if [ "$os" = "windows" ]; then SUFFIX=".exe"; fi

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" \
              -o "dist/packmon-${os}-${arch}${SUFFIX}" ./cmd/packmon
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" \
              -o "dist/packmon-server-${os}-${arch}${SUFFIX}" ./cmd/packmon-server
          done

          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/packmon-server:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ github.repository }}/packmon-server:latest
