name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version/tag to release (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run tests
        shell: bash
        run: |
          mapfile -t packages < <(go list ./...)
          go test -count=1 "${packages[@]}"

      - name: Run go vet
        shell: bash
        run: |
          mapfile -t packages < <(go list ./...)
          go vet "${packages[@]}"

      - name: Run govulncheck
        shell: bash
        run: |
          mapfile -t packages < <(go list ./...)
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck "${packages[@]}"

      - name: Run gosec
        shell: bash
        run: |
          mapfile -t package_dirs < <(go list -f '{{.Dir}}' ./...)
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -nosec-require-rules -nosec-require-justification "${package_dirs[@]}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          RELEASE_VERSION_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z][0-9A-Za-z.-]*)?$'
          # On a tag push use the tag name; on manual dispatch use the input.
          if [ "${EVENT_NAME}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          else
            RELEASE_VERSION="${REQUESTED_RELEASE_VERSION}"
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ${RELEASE_VERSION_REGEX} ]]; then
            echo "release version must match ${RELEASE_VERSION_REGEX}" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse -q --verify "${RELEASE_VERSION}^{commit}")" || {
            echo "release tag ${RELEASE_VERSION} must exist before publishing" >&2
            exit 1
          }
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "release tag must point at checked-out commit" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Build all targets
        run: |
          VERSION="${RELEASE_VERSION}"
          COMMIT=${GITHUB_SHA::8}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          declare -a TARGETS=(
            "linux:amd64"
            "linux:arm64"
            "darwin:amd64"
            "darwin:arm64"
            "windows:amd64"
            "windows:arm64"
          )

          mkdir -p dist/LICENSES

          for target in "${TARGETS[@]}"; do
            IFS=':' read -r os arch <<< "$target"
            SUFFIX=""
            if [ "$os" = "windows" ]; then SUFFIX=".exe"; fi

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" \
              -o "dist/packmon-${os}-${arch}${SUFFIX}" ./cmd/packmon
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" \
              -o "dist/packmon-server-${os}-${arch}${SUFFIX}" ./cmd/packmon-server
          done

          cp LICENSE dist/LICENSE
          cp LICENSES/LicenseRef-Private.txt dist/LICENSES/LicenseRef-Private.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.1
          cyclonedx-gomod mod -licenses -json -output dist/packmon.cdx.json

          go install github.com/google/go-licenses@v1.6.0
          go-licenses save ./cmd/packmon --save_path dist/go-license-notices
          go-licenses save ./cmd/packmon-server --save_path dist/go-license-notices
          tar -C dist -czf dist/go-license-notices.tar.gz go-license-notices
          rm -rf dist/go-license-notices

          cd dist && find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/packmon-*
            dist/checksums.txt
            dist/packmon.cdx.json
            dist/go-license-notices.tar.gz
            dist/THIRD_PARTY_NOTICES.md
            dist/LICENSE
            dist/LICENSES/LicenseRef-Private.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/**
