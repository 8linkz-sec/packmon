name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Run parser fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fuzz_targets < <(go test -count=1 ./internal/parser -run='^$' -list '^Fuzz' | grep '^Fuzz' || true)
          if [[ ${#fuzz_targets[@]} -eq 0 ]]; then
            echo "no parser fuzz targets discovered" >&2
            exit 1
          fi
          for target in "${fuzz_targets[@]}"; do
            go test -count=1 ./internal/parser -run='^$' -fuzz="^${target}$" -fuzztime=5m
          done

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Run E2E target
        run: make test-e2e
