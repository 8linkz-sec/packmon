name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run fuzz tests
        run: |
          FUZZ_TARGETS=$(grep -r "func Fuzz" --include="*_test.go" -l . || true)
          if [ -z "$FUZZ_TARGETS" ]; then
            echo "No fuzz targets found, skipping"
            exit 0
          fi
          for f in $FUZZ_TARGETS; do
            DIR=$(dirname "$f")
            FUNCS=$(grep -oP 'func \KFuzz\w+' "$f")
            for func in $FUNCS; do
              echo "Fuzzing $func in $DIR for 5m..."
              go test -fuzz="^${func}$" -fuzztime=5m "$DIR" || true
            done
          done

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          go build -o packmon ./cmd/packmon
          go build -o packmon-server ./cmd/packmon-server

      - name: Run E2E tests
        run: |
          echo "E2E tests placeholder -- will be implemented in Phase 5"
