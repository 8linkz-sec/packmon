name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.4"

      - name: Run parser fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/parser -run='^$' -list '^Fuzz' |
            while read -r target; do
              if [[ "$target" == Fuzz* ]]; then
                go test ./internal/parser -run='^$' -fuzz="^${target}$" -fuzztime=5m
              fi
            done

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.4"

      - name: Run E2E target
        run: make test-e2e
