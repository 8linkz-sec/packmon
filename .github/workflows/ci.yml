name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web tooling
        run: npm ci --ignore-scripts

      - name: Lint web assets and OpenAPI
        run: |
          npm run lint:web
          npm run lint:openapi

      - name: Check non-Go formatting
        run: bash scripts/check-non-go-format.sh

      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:v0.10.0 \
            scripts/*.sh scripts/lib/*.sh deploy/n8n/*.sh

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine < Dockerfile

      - name: Lint GitHub workflows
        env:
          GOFLAGS: "-mod=readonly"
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error

      - name: Verify generated web assets
        run: |
          npm run build:web
          git diff --exit-code -- internal/web/static/tailwind.css internal/web/static/htmx.min.js

      - name: Validate GitLab CI template
        env:
          GOFLAGS: "-mod=readonly"
        run: go test -count=1 ./tests/ci

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        env:
          GOFLAGS: "-mod=readonly"
        with:
          version: v2.11.0

      - name: Check formatting (gofumpt)
        run: |
          # Pin the formatter version for reproducible lint results.
          go install mvdan.cc/gofumpt@v0.9.2
          mapfile -t go_files < <(git ls-files '*.go')
          test -z "$(gofumpt -extra -l "${go_files[@]}")" || (gofumpt -extra -l "${go_files[@]}" && exit 1)

  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, windows-2025]
        go: ["1.26.4"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        shell: bash
        env:
          GOFLAGS: "-mod=readonly"
        run: |
          mapfile -t packages < <(go list ./...)
          go vet "${packages[@]}"
          go test -count=1 -race -coverprofile=coverage.out -covermode=atomic "${packages[@]}"
          go run ./tools/checkcoverage -profile=coverage.out -min=79.5

      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.go == '1.26.4'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run integration tests
        env:
          GOFLAGS: "-mod=readonly"
        run: make test-integration

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run E2E tests
        shell: pwsh
        env:
          GOFLAGS: "-mod=readonly"
        run: |
          New-Item -ItemType Directory -Force .build, .gotmp | Out-Null
          $env:GOTMPDIR = (Resolve-Path .gotmp).Path
          $suffix = ""
          if ($env:RUNNER_OS -eq "Windows") {
            $suffix = ".exe"
          }
          go build -o (Join-Path ".build" ("packmon" + $suffix)) ./cmd/packmon
          $env:PACKMON_TEST_BIN_DIR = (Resolve-Path .build).Path
          go test -count=1 -tags e2e ./tests/e2e

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Secret scan
        shell: bash
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          gitleaks detect --source . --redact --no-banner --verbose

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: govulncheck
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          export GOFLAGS=-mod=readonly
          mapfile -t packages < <(go list ./...)
          govulncheck "${packages[@]}"

      - name: gosec
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          export GOFLAGS=-mod=readonly
          mapfile -t package_dirs < <(go list -f '{{.Dir}}' ./...)
          gosec -nosec-require-rules -nosec-require-justification "${package_dirs[@]}"

      - name: Scan dependency lockfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Build deployment images
        shell: bash
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --target server \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${GITHUB_SHA::8} \
            --build-arg DATE="${BUILD_DATE}" \
            -t packmon-server-ci:${{ github.sha }} .
          docker build --target cli \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${GITHUB_SHA::8} \
            --build-arg DATE="${BUILD_DATE}" \
            -t packmon-cli-ci:${{ github.sha }} .

      - name: Scan server image OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: packmon-server-ci:${{ github.sha }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan CLI image OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: packmon-cli-ci:${{ github.sha }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, test, integration, e2e, security]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Build packmon
        env:
          GOFLAGS: "-mod=readonly"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          SUFFIX=""
          if [ "${{ matrix.goos }}" = "windows" ]; then SUFFIX=".exe"; fi
          go build -ldflags="-s -w -X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o packmon-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX} ./cmd/packmon
          go build -ldflags="-s -w -X main.version=ci -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o packmon-server-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX} ./cmd/packmon-server

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            packmon-*
          retention-days: 7
