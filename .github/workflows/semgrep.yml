name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Semgrep
        run: python -m pip install semgrep==1.168.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            --disable-version-check \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 7
