# Reusable workflow: Dependency Security Scan with Packmon.
#
# Called from consumer repositories via:
#   uses: 8linkz-sec/packmon/.github/workflows/packmon-scan.yml@<release-tag>
#
# All input and secret names use underscores (not hyphens) per DE-20.
# GitHub Actions expressions interpret hyphens as subtraction.
name: Packmon Scan

on:
  workflow_call:
    inputs:
      fail_on:
        description: >-
          Minimum vulnerability severity that blocks the pipeline
          (CRITICAL|HIGH|MEDIUM|LOW|NONE).
          NONE disables vulnerability blocking only; malicious and active supply-chain risk findings still block.
        required: false
        default: "CRITICAL"
        type: string
      scan_path:
        description: "Directory to scan (relative to repo root)"
        required: false
        default: "."
        type: string
      packmon_version:
        description: "Existing immutable Packmon release tag to install"
        required: true
        type: string
      binary_mirror:
        description: "Optional base URL for an internal mirror of Packmon release assets"
        required: false
        default: ""
        type: string
      upload_sarif:
        description: "Upload SARIF to GitHub Security tab"
        required: false
        default: true
        type: boolean
      post_pr_comment:
        description: >-
          Post detailed findings as a PR comment (opt-in because comments can
          disclose dependency-security data)
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: >-
          Retention period for JSON, SARIF, and JUnit scan evidence artifacts.
          Must fit the repository's GitHub Actions retention policy.
        required: false
        default: 90
        type: number
    secrets:
      packmon_server_url:
        description: "Packmon feed server URL"
        required: true
      packmon_api_key:
        description: "Packmon API key for authenticating with the feed server"
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: Packmon Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      findings_count: ${{ steps.scan.outputs.findings_count }}
      exit_code: ${{ steps.scan.outputs.exit_code }}
      feed_status: ${{ steps.scan.outputs.feed_status }}
      db_stale: ${{ steps.scan.outputs.db_stale }}
      db_age_days: ${{ steps.scan.outputs.db_age_days }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install packmon
        env:
          PACKMON_VERSION: ${{ inputs.packmon_version }}
          PACKMON_BINARY_MIRROR: ${{ inputs.binary_mirror }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKMON_VERSION_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [ -z "${PACKMON_VERSION}" ]; then
            echo "PACKMON_VERSION must name an existing immutable release tag" >&2
            exit 1
          fi
          if [[ ! "${PACKMON_VERSION}" =~ ${PACKMON_VERSION_REGEX} ]]; then
            echo "PACKMON_VERSION must be an immutable release tag like v1.2.3" >&2
            exit 1
          fi
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          DEFAULT_BINARY_BASE_URL="https://github.com/8linkz-sec/packmon/releases/download/${PACKMON_VERSION}"
          BINARY_BASE_URL="${PACKMON_BINARY_MIRROR:-${DEFAULT_BINARY_BASE_URL}}"
          BINARY_BASE_URL="${BINARY_BASE_URL%/}"
          BINARY_NAME="packmon-linux-${ARCH}"
          BINARY_URL="${BINARY_BASE_URL}/${BINARY_NAME}"
          CHECKSUM_URL="${BINARY_BASE_URL}/checksums.txt"
          CURL_FLAGS="--fail --show-error --location --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 120"
          echo "Downloading packmon from ${BINARY_URL}"
          curl ${CURL_FLAGS} "${BINARY_URL}" -o "/tmp/${BINARY_NAME}"
          curl ${CURL_FLAGS} "${CHECKSUM_URL}" -o /tmp/checksums.txt
          grep -E "[[:space:]]${BINARY_NAME}$" /tmp/checksums.txt > "/tmp/${BINARY_NAME}.sha256"
          (cd /tmp && sha256sum -c "${BINARY_NAME}.sha256")
          gh attestation verify "/tmp/${BINARY_NAME}" \
            --repo 8linkz-sec/packmon \
            --signer-workflow 8linkz-sec/packmon/.github/workflows/release.yml \
            --source-ref "refs/tags/${PACKMON_VERSION}"
          sudo install -m 0755 "/tmp/${BINARY_NAME}" /usr/local/bin/packmon
          packmon version

      - name: Run scan
        id: scan
        env:
          PACKMON_SERVER: ${{ secrets.packmon_server_url }}
          PACKMON_API_KEY: ${{ secrets.packmon_api_key }}
          PACKMON_SCAN_PATH: ${{ inputs.scan_path }}
          PACKMON_FAIL_ON: ${{ inputs.fail_on }}
        run: |
          set -euo pipefail
          case "${PACKMON_FAIL_ON}" in
            CRITICAL|HIGH|MEDIUM|LOW|NONE) ;;
            *)
              echo "fail_on must be one of CRITICAL, HIGH, MEDIUM, LOW, or NONE" >&2
              exit 1
              ;;
          esac

          case "${PACKMON_SCAN_PATH}" in
            ""|/*|-*|*..*|*$'\n'*|*$'\r'*)
              echo "scan_path must be a non-empty relative path without parent traversal or leading dash" >&2
              exit 1
              ;;
          esac

          set +e
          packmon scan \
            --fail-on "${PACKMON_FAIL_ON}" \
            --mode remote \
            --no-project-config \
            --output-json /tmp/results.json \
            --output-sarif /tmp/results.sarif \
            --output-junit /tmp/results.xml \
            -- "${PACKMON_SCAN_PATH}"
          EXIT_CODE=$?
          set -e

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Extract findings count from JSON output.
          FINDINGS=$(jq '.findings_count // 0' /tmp/results.json 2>/dev/null || echo 0)
          echo "findings_count=${FINDINGS}" >> "$GITHUB_OUTPUT"
          FEED_STATUS=$(jq -r '.feed_status // "unknown"' /tmp/results.json 2>/dev/null || echo unknown)
          DB_STALE=$(
            jq -r 'if .db_stale == true then "true" else "false" end' /tmp/results.json 2>/dev/null ||
              echo false
          )
          DB_AGE_DAYS=$(
            jq -r 'if .db_age_days == null then "" else (.db_age_days | tostring) end' \
              /tmp/results.json 2>/dev/null ||
              echo ""
          )
          echo "feed_status=${FEED_STATUS}" >> "$GITHUB_OUTPUT"
          echo "db_stale=${DB_STALE}" >> "$GITHUB_OUTPUT"
          echo "db_age_days=${DB_AGE_DAYS}" >> "$GITHUB_OUTPUT"

          echo "Packmon feed status: ${FEED_STATUS}"
          echo "Packmon local DB stale: ${DB_STALE}"
          if [ -n "${DB_AGE_DAYS}" ]; then
            echo "Packmon local DB age days: ${DB_AGE_DAYS}"
          fi
          if [ "${FEED_STATUS}" != "healthy" ] || [ "${DB_STALE}" = "true" ]; then
            printf '%s%s%s\n' \
              "::warning::Packmon scan coverage degraded (feed_status=${FEED_STATUS}, " \
              "db_stale=${DB_STALE}, " \
              "db_age_days=${DB_AGE_DAYS:-unknown})"
            {
              echo "### Packmon Coverage Warning"
              echo ""
              echo "- feed_status: \`${FEED_STATUS}\`"
              echo "- db_stale: \`${DB_STALE}\`"
              echo "- db_age_days: \`${DB_AGE_DAYS:-unknown}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Exit code 3 means findings below the blocking threshold were
          # reported. Per the exit-code contract this is a passing run.
          if [ "${EXIT_CODE}" = "3" ]; then
            echo "Findings below blocking threshold; job stays green."
            EXIT_CODE=0
          fi

          exit $EXIT_CODE

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: packmon-results
          path: |
            /tmp/results.json
            /tmp/results.sarif
            /tmp/results.xml
          retention-days: ${{ inputs.artifact_retention_days }}

  attest-results:
    name: Attest scan results
    runs-on: ubuntu-24.04
    needs: scan
    if: >-
      always()
      && needs.scan.outputs.exit_code != ''
      && needs.scan.result != 'cancelled'
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packmon-results
          path: /tmp/packmon-results

      - name: Attest scan result artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            /tmp/packmon-results/results.json
            /tmp/packmon-results/results.sarif
            /tmp/packmon-results/results.xml

  upload-sarif:
    name: Upload SARIF
    runs-on: ubuntu-24.04
    needs: scan
    if: >-
      always()
      && inputs.upload_sarif
      && needs.scan.outputs.exit_code != ''
      && needs.scan.result != 'cancelled'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packmon-results
          path: /tmp/packmon-results

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: /tmp/packmon-results/results.sarif
          category: packmon

  pr-comment:
    name: PR comment
    runs-on: ubuntu-24.04
    needs: scan
    if: >-
      always()
      && inputs.post_pr_comment
      && github.event_name == 'pull_request'
      && needs.scan.outputs.findings_count > 0
      && needs.scan.outputs.exit_code != ''
      && needs.scan.result != 'cancelled'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packmon-results
          path: /tmp/packmon-results

      - name: PR comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PACKMON_FAIL_ON: ${{ inputs.fail_on }}
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('/tmp/packmon-results/results.json', 'utf8'));
            const findings = Array.isArray(results.findings) ? results.findings : [];
            const FINDINGS_PER_CATEGORY_LIMIT = 10;
            const feedStatusRaw = results.feed_status || 'unknown';
            const dbStale = results.db_stale === true;
            const dbAgeDays =
              results.db_age_days === undefined || results.db_age_days === null
                ? ''
                : String(results.db_age_days);

            const mdCell = (value, fallback = 'n/a') => {
              const raw = value === undefined || value === null || value === '' ? fallback : String(value);
              return raw
                .replace(/[\r\n\t]+/g, ' ')
                .replace(/\\/g, '\\\\')
                .replace(/\|/g, '\\|')
                .replace(/`/g, '\\`')
                .replace(/\[/g, '\\[')
                .replace(/\]/g, '\\]')
                .replace(/\(/g, '\\(')
                .replace(/\)/g, '\\)')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .slice(0, 240);
            };

            const safeMarkdownURL = (value) => {
              if (!value) {
                return '';
              }
              const raw = String(value).trim();
              try {
                const parsed = new URL(raw);
                if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') {
                  return '';
                }
                return parsed.toString().replace(/\)/g, '%29');
              } catch {
                return '';
              }
            };

            const packageCell = (finding) => mdCell(`${finding.name ?? 'unknown'}@${finding.version ?? 'unknown'}`);
            const advisoryCell = (finding) => {
              const id = mdCell(finding.advisory_id || 'n/a');
              const url = safeMarkdownURL(finding.url);
              return url ? `[${id}](${url})` : id;
            };
            const row = (cells) => `| ${cells.join(' | ')} |\n`;
            const severityRank = new Map([
              ['CRITICAL', 4],
              ['HIGH', 3],
              ['MEDIUM', 2],
              ['LOW', 1],
              ['NONE', 0],
            ]);
            const severityScore = (finding) => severityRank.get(String(finding.severity || '').toUpperCase()) ?? -1;
            const sortFindings = (entries) =>
              entries
                .map((finding, index) => ({ finding, index }))
                .sort((left, right) => {
                  const severityDelta = severityScore(right.finding) - severityScore(left.finding);
                  if (severityDelta !== 0) {
                    return severityDelta;
                  }
                  const packageDelta = packageCell(left.finding).localeCompare(packageCell(right.finding));
                  if (packageDelta !== 0) {
                    return packageDelta;
                  }
                  const advisoryDelta = mdCell(
                    left.finding.advisory_id || left.finding.title || left.finding.risk_type || left.index
                  ).localeCompare(mdCell(
                    right.finding.advisory_id || right.finding.title || right.finding.risk_type || right.index
                  ));
                  return advisoryDelta !== 0 ? advisoryDelta : left.index - right.index;
                })
                .map(entry => entry.finding);
            const renderFindingSection = (title, entries, category, headers, renderCells) => {
              if (entries.length === 0) {
                return '';
              }
              entries = sortFindings(entries);
              const visible = entries.slice(0, FINDINGS_PER_CATEGORY_LIMIT);
              const omitted = entries.length - visible.length;
              let section = `### ${title}\n\n`;
              section += row(headers);
              section += row(headers.map(() => '---'));
              for (const f of visible) {
                section += row(renderCells(f));
              }
              if (omitted > 0) {
                section += `\n_${omitted} more ${category} finding(s) omitted; see packmon-results artifact._\n`;
              }
              section += `\n`;
              return section;
            };

            const vulns = findings.filter(f => f.type === 'vulnerability');
            const malicious = findings.filter(f => f.type === 'malicious');
            const supplyChain = findings.filter(f => f.type === 'supply_chain_risk');
            const lifecycle = findings.filter(f => f.type === 'lifecycle');

            let body = `## Packmon Security Scan\n\n`;
            body += `**${mdCell(results.findings_count ?? findings.length)} finding(s)**`;
            body += ` in ${mdCell(results.packages_scanned ?? 0)} packages`;
            body += ` | mode: ${mdCell(results.mode || 'unknown')}`;
            body += ` | threshold: ${mdCell(process.env.PACKMON_FAIL_ON || 'CRITICAL')}`;
            body += ` | feed: ${mdCell(feedStatusRaw)}`;
            if (dbStale) {
              body += ` | local DB stale`;
            }
            if (dbAgeDays) {
              body += ` | local DB age: ${mdCell(dbAgeDays)} day(s)`;
            }
            body += `\n\n`;

            if (String(feedStatusRaw) !== 'healthy' || results.db_stale === true) {
              body += `> **Coverage warning:** Packmon scan coverage degraded.`;
              body += ` feed_status=${mdCell(feedStatusRaw)}`;
              body += `, db_stale=${mdCell(dbStale)}`;
              body += `, db_age_days=${mdCell(dbAgeDays || 'unknown')}\n\n`;
            }

            body += renderFindingSection(
              'Vulnerability Findings',
              vulns,
              'vulnerability',
              ['Severity', 'Package', 'Ecosystem', 'Advisory', 'Fix Version', 'Source'],
              f => [
                mdCell(f.severity),
                packageCell(f),
                mdCell(f.ecosystem),
                advisoryCell(f),
                mdCell(f.fixed_version),
                mdCell(f.source),
              ]
            );

            body += renderFindingSection(
              'Malicious Findings',
              malicious,
              'malicious',
              ['Severity', 'Package', 'Ecosystem', 'Threat', 'Action', 'Source'],
              f => [
                mdCell(f.severity),
                packageCell(f),
                mdCell(f.ecosystem),
                mdCell(f.risk_type || f.title || 'unknown'),
                'Remove package',
                mdCell(f.source),
              ]
            );

            body += renderFindingSection(
              'Supply Chain Risk Findings',
              supplyChain,
              'supply-chain risk',
              ['Severity', 'Package', 'Ecosystem', 'Risk', 'Action', 'Source'],
              f => [
                mdCell(f.severity),
                packageCell(f),
                mdCell(f.ecosystem),
                mdCell(f.risk_type || f.title || f.advisory_id || 'unknown'),
                'Review package',
                mdCell(f.source),
              ]
            );

            body += renderFindingSection(
              'Lifecycle Findings',
              lifecycle,
              'lifecycle',
              ['Severity', 'Package', 'Ecosystem', 'Status', 'Fixed Version', 'Source'],
              f => [
                mdCell(f.severity),
                packageCell(f),
                mdCell(f.ecosystem),
                mdCell(f.title || f.advisory_id || 'unsupported'),
                mdCell(f.fixed_version),
                mdCell(f.source),
              ]
            );

            // Update existing comment or create a new one.
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Packmon Security Scan';
            const existing = comments.data.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
