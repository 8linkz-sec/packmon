# Local development overlay. Compose auto-loads this file, so `docker compose up`
# is the friendly local path. Production uses `docker compose -f docker-compose.yml
# -f docker-compose.prod.yml` (an explicit -f list disables auto-loading of this
# override).
services:
  # One-shot: generate/complete .env with local secrets. Run via
  # `docker compose run --rm init-secrets`. Bind-mounts the project dir to write
  # the host .env; runs in Linux so encoding/line-endings are correct on any OS.
  init-secrets:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ["init-secrets"]
    working_dir: /workspace
    volumes:
      - ".:/workspace"
    restart: "no"

  # Local convenience: packmon-migrate is `profiles: ["manual"]` in the base
  # file so it never runs implicitly there. Locally we want the friendly
  # auto-chain (postgres -> migrate -> server), so clear its profile here;
  # this does not affect explicit `-f docker-compose.yml -f
  # docker-compose.prod.yml` production runs, which never load this override.
  packmon-migrate:
    profiles: !override []

  # Local convenience: the base file's secret defaults are already permissive
  # (${VAR:-}), so `init-secrets` can run before .env exists and the app-level
  # validator produces the actionable message. Only the insecure-HTTP default
  # needs to flip here; the strict :? guards live in docker-compose.prod.yml.
  packmon-server:
    environment:
      PACKMON_ALLOW_INSECURE_LOCAL_HTTP: ${PACKMON_ALLOW_INSECURE_LOCAL_HTTP:-true}
    depends_on:
      postgres:
        condition: service_healthy
      packmon-migrate:
        condition: service_completed_successfully
